[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaparral"
version = "0.3.0"
description = "Official Python client for the Chaparral proteomics platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Chaparral" }]
keywords = ["chaparral", "proteomics", "mass-spectrometry", "sage", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://chaparral.ai"
Documentation = "https://docs.chaparral.ai/python"
Repository = "https://github.com/ChaparralLabs/chaparral-api"
Issues = "https://github.com/ChaparralLabs/chaparral-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chaparral"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
